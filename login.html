<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — Астрономический центр</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div style="margin-bottom: 1.5rem;">
      <a href="index.html" class="btn-secondary" style="text-decoration: none; display: inline-block; padding: 0.5rem 1rem;">Назад на главную</a>
    </div>

    <h1>Астрономический центр</h1>

    <div id="auth-box" class="card">
      <h2 id="form-title">Вход в систему</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Пароль">
      <div style="margin-top: 10px;">
        <button id="btn-login">Войти</button>
        <button id="btn-register" class="btn-secondary">Регистрация</button>
      </div>
      <p id="auth-msg" style="margin-top: 10px; color: #8ec8f8;"></p>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
