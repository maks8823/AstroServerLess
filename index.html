<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Астрономический центр</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Главная</a>
    <a href="excursions.html">Экскурсии</a>
    <a href="login.html" id="nav-auth">Войти</a>
    <a href="admin.html" id="nav-admin" style="display:none">Панель управления</a>
  </nav>

  <div class="container">
    <h1>Астрономический центр</h1>
    <p>Исследование космоса, наблюдение за звёздами и образовательные программы.</p>
    
    <hr style="margin: 2rem 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
    
    <h2>Новости и события</h2>
    <div id="news-list">Загрузка новостей...</div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const ADMIN_EMAIL = "maks88232002@gmail.com";

    onAuthStateChanged(auth, user => {
      const navAuth = document.getElementById("nav-auth");
      const navAdmin = document.getElementById("nav-admin");
      if (user) {
        navAuth.textContent = `Выйти (${user.email})`;
        navAuth.href = "#";
        navAuth.onclick = () => signOut(auth).then(() => location.reload());
        if (user.email === ADMIN_EMAIL) {
          navAdmin.style.display = "inline";
        }
      }
    });

        async function loadNews() {
      const list = document.getElementById("news-list");
      try {
        const q = query(collection(db, "news"), orderBy("date", "desc"));
        const snap = await getDocs(q);
        list.innerHTML = "";

        if (snap.empty) {
          list.innerHTML = "<p>Новостей пока нет.</p>";
          return;
        }

        snap.forEach(doc => {
          const imgHtml = d.imageUrl 
  ? `<img src="${d.imageUrl}" style="width:100%; height:auto; display:block; border-radius:6px; margin-bottom:12px;">` 
  : "";

          list.innerHTML += `
            <article class="card">
              ${imgHtml}
              <h3>${d.title}</h3>
              <p style="margin: 8px 0;">${d.text}</p>
              <small style="color: #7eb8e0;">Дата публикации: ${d.date}</small>
            </article>
          `;
        });
      } catch (e) {
        list.innerHTML = "<p>Ошибка загрузки новостей.</p>";
      }
    }

    loadNews();
  </script>
</body>
</html>
