<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Астрономический центр</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Главная</a>
    <a href="excursions.html">Экскурсии</a>
    <a href="login.html" id="nav-auth">Войти</a>
    <a href="admin.html" id="nav-admin" style="display:none">Панель управления</a>
  </nav>

  <div class="container">
    <h1>Астрономический центр</h1>
    <p>Исследование космоса, наблюдение за звёздами и образовательные программы.</p>
    
    <hr style="margin: 2rem 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
    
    <h2>Новости и события</h2>
    <div id="news-list">Загрузка новостей...</div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Список админов
    const ADMIN_EMAILS = [
      "maks88232002@gmail.com",
      "nasakiakio@gmail.com"
    ];

    // Проверка без учёта заглавных/строчных букв
    function isAdmin(email) {
      if (!email) return false;
      return ADMIN_EMAILS.map(e => e.toLowerCase()).includes(email.toLowerCase());
    }

    onAuthStateChanged(auth, (user) => {
      const navAuth = document.getElementById("nav-auth");
      const navAdmin = document.getElementById("nav-admin");
      
      if (user) {
        navAuth.textContent = `Выйти (${user.email})`;
        navAuth.href = "#";
        navAuth.onclick = (e) => {
          e.preventDefault();
          signOut(auth).then(() => location.reload());
        };
        
        // Показываем кнопку админа
        if (isAdmin(user.email) && navAdmin) {
          navAdmin.style.display = "inline-block";
        }
      }
    });

    async function loadNews() {
      const list = document.getElementById("news-list");
      try {
        const snap = await getDocs(collection(db, "news"));
        list.innerHTML = "";

        if (snap.empty) {
          list.innerHTML = "<p>Новостей пока нет.</p>";
          return;
        }

        const newsList = [];
        snap.forEach((doc) => newsList.push({ id: doc.id, ...doc.data() }));

        // Новые новости сверху
        newsList.sort((a, b) => {
          const ta = a.createdAt || 0;
          const tb = b.createdAt || 0;
          if (tb !== ta) return tb - ta;
          return String(b.date || "").localeCompare(String(a.date || ""), "ru");
        });

        newsList.forEach((d) => {
          const imgHtml = d.imageUrl 
            ? `<img src="${d.imageUrl}" style="width:100%; height:auto; display:block; border-radius:6px; margin-bottom:12px;" alt="Фото новости">` 
            : "";

          list.innerHTML += `
            <article class="card">
              ${imgHtml}
              <h3>${d.title || "Без названия"}</h3>
              <p style="margin: 8px 0; white-space: pre-wrap;">${d.text || ""}</p>
              <small style="color: #7eb8e0;">Опубликовано: ${d.date || "—"}</small>
            </article>
          `;
        });
      } catch (e) {
        console.error(e);
        list.innerHTML = `<p style="color: #ff6b6b;">Ошибка загрузки новостей: ${e.message}</p>`;
      }
    }

    loadNews();
  </script>
</body>
</html>
